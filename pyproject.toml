[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-ipod"
version = "0.1.0"
description = "A compact, customizable interface for browsing and playing Spotify music."
requires-python = ">=3.14,<3.15"
dependencies = [
    "Flask[dotenv]>=3.1,<4",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
desktop = [
    "pywebview>=6.2,<7",
]

[project.scripts]
spotify-pocket-player = "app.desktop:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
