[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-ipod"
version = "0.1.0"
description = "An iPod-inspired interface for browsing and playing Spotify music."
requires-python = ">=3.14,<3.15"
dependencies = [
    "Flask>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]